version: '3.8'

services:
  # Reverse Proxy Traefik v3.7: O SISTEMA UNIFICADO é acessado na PORTA 880 do host
  traefik:
    image: traefik:v3.7
    container_name: rheserva_traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:880"
    ports:
      - "880:880"   # Porta 880 do Host -> Entrada do SISTEMA UNIFICADO (Vue + Laravel API)
      - "8881:8080" # Porta 8881 do Host -> Dashboard do Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  database:
    image: mysql:8.0
    container_name: rheserva_mysql
    restart: always
    environment:
      MYSQL_DATABASE: rheserva_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: rheserva_redis
    restart: always

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rheserva_backend
    restart: always
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: rheserva_db
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      SESSION_DRIVER: file
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rheserva_backend.rule=PathPrefix(`/api`) || PathPrefix(`/storage`)"
      - "traefik.http.routers.rheserva_backend.entrypoints=web"
      - "traefik.http.services.rheserva_backend.loadbalancer.server.port=8000"
    depends_on:
      - database
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rheserva_frontend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rheserva_frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.rheserva_frontend.entrypoints=web"
      - "traefik.http.services.rheserva_frontend.loadbalancer.server.port=5173"
    depends_on:
      - backend

volumes:
  db_data:

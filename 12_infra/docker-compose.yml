services:
  traefik:
    image: traefik:v3.7
    container_name: rheserva_q12_traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:882"
    ports:
      - "882:882"   # Porta 882 do Host -> Entrada do SISTEMA DE CHECKOUT (100% front-end)
      - "8882:8080" # Porta 8882 do Host -> Dashboard Traefik Q12
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  frontend:
    build:
      context: ../12_frontend
      dockerfile: Dockerfile
    container_name: rheserva_q12_frontend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rheserva_q12_frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.rheserva_q12_frontend.entrypoints=web"
      - "traefik.http.services.rheserva_q12_frontend.loadbalancer.server.port=5173"

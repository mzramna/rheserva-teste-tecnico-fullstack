services:
  traefik:
    image: traefik:v3.7
    container_name: rheserva_q12_traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:882"
    ports:
      - "882:882"   # Porta 882 do Host -> Entrada do SISTEMA DE CHECKOUT
      - "8882:8080" # Porta 8882 do Host -> Dashboard Traefik Q12
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  database:
    image: mysql:8.0
    container_name: rheserva_q12_mysql
    restart: always
    environment:
      MYSQL_DATABASE: rheserva_q12_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - q12_db_data:/var/lib/mysql

  backend:
    build:
      context: ../12_backend
      dockerfile: Dockerfile
    container_name: rheserva_q12_backend
    restart: always
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: rheserva_q12_db
      DB_USERNAME: root
      DB_PASSWORD: root
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rheserva_q12_backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.rheserva_q12_backend.entrypoints=web"
      - "traefik.http.services.rheserva_q12_backend.loadbalancer.server.port=8000"
    depends_on:
      - database

  frontend:
    build:
      context: ../12_frontend
      dockerfile: Dockerfile
    container_name: rheserva_q12_frontend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rheserva_q12_frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.rheserva_q12_frontend.entrypoints=web"
      - "traefik.http.services.rheserva_q12_frontend.loadbalancer.server.port=5173"
    depends_on:
      - backend

volumes:
  q12_db_data:
